# Ruff configuration - formatting and baseline linting for CI.
# The rule selection is deliberately conservative (pyflakes + core pycodestyle
# + import sorting); the formatter enforces layout so hand-aligned assignments
# and inconsistent wrapping cannot drift back in.
target-version = "py313"
line-length = 88

[lint]
select = [
    "E4", # pycodestyle: imports
    "E7", # pycodestyle: statements
    "E9", # pycodestyle: runtime errors
    "F",  # pyflakes
    "I",  # isort
]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.tiktoktts"]
combine-as-imports = true
