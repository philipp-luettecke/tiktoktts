name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run daily so we catch breakage from Home Assistant / HACS changes even
    # when the repo itself hasn't changed.
    - cron: "30 4 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
